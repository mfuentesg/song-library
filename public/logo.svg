<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="capoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Capo icon - guitar neck with capo -->
  <g transform="translate(15, 15)">
    <!-- Guitar neck (fretboard) -->
    <rect x="0" y="20" width="80" height="50" rx="4" fill="#78350f"/>
    <!-- Frets -->
    <rect x="20" y="20" width="3" height="50" fill="#fbbf24"/>
    <rect x="40" y="20" width="3" height="50" fill="#fbbf24"/>
    <rect x="60" y="20" width="3" height="50" fill="#fbbf24"/>
    <!-- Strings -->
    <line x1="0" y1="30" x2="80" y2="30" stroke="#d4d4d4" stroke-width="1.5"/>
    <line x1="0" y1="38" x2="80" y2="38" stroke="#d4d4d4" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="80" y2="45" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="0" y1="52" x2="80" y2="52" stroke="#a3a3a3" stroke-width="2"/>
    <line x1="0" y1="60" x2="80" y2="60" stroke="#737373" stroke-width="2.5"/>
    <!-- Capo bar -->
    <rect x="25" y="15" width="12" height="60" rx="6" fill="url(#capoGradient)"/>
    <rect x="28" y="18" width="6" height="54" rx="3" fill="#fdba74"/>
  </g>
  
  <!-- Text: Capo -->
  <text x="115" y="72" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#1f2937" letter-spacing="-2">
    Capo
  </text>
  
  <!-- Tagline -->
  <text x="115" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6b7280">
    ChordPro • Transpose • Collaborate
  </text>
</svg>
